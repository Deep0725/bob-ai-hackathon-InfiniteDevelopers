  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
  We are most proud of combining automated safety signal detection with regulatory submission readiness assessment in a single workflow, allowing users to move from raw safety data to actionable
  findings and readiness information through one application.

  known_limitations: >                 # Optional but recommended — be honest about gaps
   The current prototype is intended as a hackathon proof of concept and may not cover every real-world pharmacovigilance workflow or regulatory requirement.
   Signal results should be reviewed by qualified safety and regulatory professionals before being used for real-world decisions.

