submission:
  title: "Drug Safety Signal Detector & Regulatory Submission Readiness Checker"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
   Pharmaceutical safety teams need to analyze large volumes of adverse event and drug safety data to identify potential 
   safety signals and assess whether the available evidence is ready for regulatory review. Manual analysis can be time-consuming 
   and may make it difficult to consistently identify and prioritize potential safety concerns.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
   We built an AI-assisted drug safety analysis system that processes safety data, detects potential safety signals using statistical analysis such as Proportional Reporting Ratio (PRR), and provides a regulatory submission readiness assessment.
   The system helps safety teams identify important signals and organize the findings for further regulatory review.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
  - "Drug safety data ingestion and processing"
  - "Automated potential safety signal detection" 
  - "Proportional Reporting Ratio (PRR) based signal analysis"
  - "Signal results and risk prioritization dashboard" 
  - "Regulatory submission readiness assessment"                        # optional 5th

 tech_stack:
    languages: ["JavaScript", "HTML", "CSS"] 
